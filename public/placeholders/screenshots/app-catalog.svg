<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750">
    <style>
    @keyframes drift-scatalog {
      0%, 100% { transform: translate3d(0, 0, 0) scale(1.06); }
      50% { transform: translate3d(-2%, 2.5%, 0) scale(1.14); }
    }
    @keyframes grain-scatalog {
      0%, 100% { transform: translate(0, 0); opacity: 0.14; }
      25% { transform: translate(-1.5%, 1%); opacity: 0.2; }
      50% { transform: translate(1%, -1.5%); opacity: 0.12; }
      75% { transform: translate(1.5%, 1.5%); opacity: 0.18; }
    }
    .drift { animation: drift-scatalog 32s ease-in-out infinite; transform-origin: center; }
    .grain { animation: grain-scatalog 7s steps(4, end) infinite; }
    @media (prefers-reduced-motion: reduce) {
      .drift, .grain { animation: none; }
    }
  </style>
    
    <defs>
      <linearGradient id="gscatalog" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#101826"></stop>
        <stop offset="55%" stop-color="#25405E"></stop>
        <stop offset="100%" stop-color="#7FA8C9"></stop>
      </linearGradient>
      <radialGradient id="rscatalog" cx="0.72" cy="0.14" r="0.95">
        <stop offset="0%" stop-color="#ffffff" stop-opacity="0.3"/>
        <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
      </radialGradient>
      <radialGradient id="vscatalog" cx="0.5" cy="0.55" r="0.75">
        <stop offset="0%" stop-color="#000000" stop-opacity="0"/>
        <stop offset="100%" stop-color="#000000" stop-opacity="0.42"/>
      </radialGradient>
      <filter id="nscatalog" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
