<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750">
    <style>
    @keyframes drift-splayer {
      0%, 100% { transform: translate3d(0, 0, 0) scale(1.06); }
      50% { transform: translate3d(-2%, 2.5%, 0) scale(1.14); }
    }
    @keyframes grain-splayer {
      0%, 100% { transform: translate(0, 0); opacity: 0.14; }
      25% { transform: translate(-1.5%, 1%); opacity: 0.2; }
      50% { transform: translate(1%, -1.5%); opacity: 0.12; }
      75% { transform: translate(1.5%, 1.5%); opacity: 0.18; }
    }
    .drift { animation: drift-splayer 32s ease-in-out infinite; transform-origin: center; }
    .grain { animation: grain-splayer 7s steps(4, end) infinite; }
    @media (prefers-reduced-motion: reduce) {
      .drift, .grain { animation: none; }
    }
  </style>
    
    <defs>
      <linearGradient id="gsplayer" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#3A2410"></stop>
        <stop offset="55%" stop-color="#8C5A22"></stop>
        <stop offset="100%" stop-color="#F0C674"></stop>
      </linearGradient>
      <radialGradient id="rsplayer" cx="0.72" cy="0.14" r="0.95">
        <stop offset="0%" stop-color="#ffffff" stop-opacity="0.3"/>
        <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
      </radialGradient>
      <radialGradient id="vsplayer" cx="0.5" cy="0.55" r="0.75">
        <stop offset="0%" stop-color="#000000" stop-opacity="0"/>
        <stop offset="100%" stop-color="#000000" stop-opacity="0.42"/>
      </radialGradient>
      <filter id="nsplayer" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    </defs>
    <rect width="1200" height="750" fill="#07080A"/>
    <rect width="1200" height="750" fill="url(#gsplayer)" opacity="0.28"/>
    <rect class="drift" width="1200" height="750" fill="url(#rsplayer)" opacity="0.6"/>
    <rect x="48" y="48" width="1104" height="510" rx="16" fill="#000000" opacity="0.4"/>
           <rect x="48" y="48" width="1104" height="510" rx="16" fill="url(#gsplayer)" opacity="0.5"/>
           <circle cx="600" cy="303" r="40" fill="#F4F2ED" opacity="0.85"/>
           <path d="M588 285 L620 303 L588 321 Z" fill="#07080A"/>
           <rect x="48" y="582" width="1104" height="6" rx="3" fill="#F4F2ED" opacity="0.2"/>
           <rect x="48" y="582" width="463.68" height="6" rx="3" fill="#E7B24B"/>
           <circle cx="511.68" cy="585" r="9" fill="#E7B24B"/>
           <rect x="48" y="620" width="90" height="10" rx="5" fill="#F4F2ED" opacity="0.35"/>
           <rect x="1062" y="620" width="90" height="10" rx="5" fill="#F4F2ED" opacity="0.35"/>
    <rect class="grain" width="1200" height="750" filter="url(#nsplayer)" opacity="0.1"/>
    <text x="600" y="724" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" letter-spacing="3" fill="#F4F2ED" opacity="0.55">ПЛЕЕР</text>
  </svg>