        <stop offset="55%" stop-color="#6B4E1E"><animate attributeName="stop-color" values="#6B4E1E;#D9B26A;#6B4E1E" dur="26s" repeatCount="indefinite"/></stop>
        <stop offset="100%" stop-color="#D9B26A"><animate attributeName="stop-color" values="#D9B26A;#241C0E;#D9B26A" dur="30s" repeatCount="indefinite"/></stop>
      </linearGradient>
      <radialGradient id="rp3" cx="0.72" cy="0.14" r="0.95">
