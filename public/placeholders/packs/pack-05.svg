<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid slice">
    <style>
    @keyframes drift-p4 {
      0%, 100% { transform: translate3d(0, 0, 0) scale(1.06); }
      50% { transform: translate3d(-2%, 2.5%, 0) scale(1.14); }
    }
    @keyframes grain-p4 {
      0%, 100% { transform: translate(0, 0); opacity: 0.14; }
      25% { transform: translate(-1.5%, 1%); opacity: 0.2; }
      50% { transform: translate(1%, -1.5%); opacity: 0.12; }
      75% { transform: translate(1.5%, 1.5%); opacity: 0.18; }
    }
    .drift { animation: drift-p4 34s ease-in-out infinite; transform-origin: center; }
    .grain { animation: grain-p4 7s steps(4, end) infinite; }
    @media (prefers-reduced-motion: reduce) {
      .drift, .grain { animation: none; }
    }
  </style>
    
    <defs>
      <linearGradient id="gp4" x1="0" y1="0" x2="1" y2="1">
